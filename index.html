<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamline CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-6xl mx-auto p-6">
        <!-- Header & Navigation -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm gap-4">
            <h1 class="text-2xl font-bold text-gray-800">Streamline CRM</h1>
            
            <!-- Page Navigation Tabs -->
            <nav class="flex space-x-2 bg-gray-100 p-1 rounded-lg">
                <button onclick="switchPage('leads')" id="nav-leads" class="px-4 py-2 text-sm font-medium rounded-md transition bg-white text-blue-600 shadow-sm">Leads Dashboard</button>
                <button onclick="switchPage('add')" id="nav-add" class="px-4 py-2 text-sm font-medium rounded-md transition text-gray-600 hover:text-gray-900">Add New Lead</button>
            </nav>

            <span class="text-xs bg-green-100 text-green-700 font-semibold px-3 py-1 rounded-full">Secured via Vercel API</span>
        </header>

        <!-- PAGE 1: LEADS DASHBOARD -->
        <div id="page-leads" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm overflow-x-auto">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">All Leads Database</h2>
                    <button onclick="fetchLeads()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">🔄 Refresh</button>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b text-sm text-gray-500">
                            <th class="py-2 px-3">Name</th>
                            <th class="py-2 px-3">Email</th>
                            <th class="py-2 px-3">Phone</th>
                            <th class="py-2 px-3">Value</th>
                            <th class="py-2 px-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="text-sm text-gray-700">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-gray-400">Loading leads...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- PAGE 2: ADD NEW LEAD FORM -->
        <div id="page-add" class="hidden max-w-xl mx-auto">
            <div class="bg-white p-8 rounded-xl shadow-sm">
                <h2 class="text-xl font-semibold mb-6 text-gray-800">Add a New Lead</h2>
                <form id="leadForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
                        <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Email Address</label>
                        <input type="email" id="email" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Phone Number</label>
                        <input type="text" id="phone" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Estimated Value (₹)</label>
                        <input type="number" id="value" value="0" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">Save Lead to Database</button>
                </form>
            </div>
        </div>

    </div>

    <!-- JavaScript Navigation & API Handling -->
    <script>
        function switchPage(page) {
            const leadsPage = document.getElementById('page-leads');
            const addPage = document.getElementById('page-add');
            const navLeads = document.getElementById('nav-leads');
            const navAdd = document.getElementById('nav-add');

            if (page === 'leads') {
                leadsPage.classList.remove('hidden');
                addPage.classList.add('hidden');
                navLeads.className = "px-4 py-2 text-sm font-medium rounded-md transition bg-white text-blue-600 shadow-sm";
                navAdd.className = "px-4 py-2 text-sm font-medium rounded-md transition text-gray-600 hover:text-gray-900";
                fetchLeads();
            } else {
                leadsPage.classList.add('hidden');
                addPage.classList.remove('hidden');
                navAdd.className = "px-4 py-2 text-sm font-medium rounded-md transition bg-white text-blue-600 shadow-sm";
                navLeads.className = "px-4 py-2 text-sm font-medium rounded-md transition text-gray-600 hover:text-gray-900";
            }
        }

        async function fetchLeads() {
            try {
                const response = await fetch('/api/leads');
                const leads = await response.json();
                
                const tbody = document.getElementById('leadsTableBody');
                if (!leads || leads.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-400">No leads found. Add your first lead!</td></tr>`;
                    return;
                }

                tbody.innerHTML = leads.map(lead => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="py-3 px-3 font-medium text-gray-800">${lead.name || ''}</td>
                        <td class="py-3 px-3 text-gray-500">${lead.email || '-'}</td>
                        <td class="py-3 px-3 text-gray-500">${lead.phone || '-'}</td>
                        <td class="py-3 px-3">₹${lead.value || 0}</td>
                        <td class="py-3 px-3"><span class="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded-full">${lead.status || 'New'}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error fetching leads:', err);
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const newLead = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                value: parseFloat(document.getElementById('value').value) || 0,
                status: 'New'
            };

            try {
                const response = await fetch('/api/leads', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-api-key': 'my_super_secret_crm_key_9876'
                    },
                    body: JSON.stringify(newLead)
                });

                if (response.ok) {
                    document.getElementById('leadForm').reset();
                    alert('Lead saved successfully!');
                    switchPage('leads'); // Return to dashboard automatically
                } else {
                    alert('Unauthorized or failed to save lead');
                }
            } catch (err) {
                console.error('Error saving lead:', err);
            }
        }

        // Initial load
        fetchLeads();
    </script>
</body>
</html>
