<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamline CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-bold text-gray-800">Streamline CRM</h1>
            <span class="text-xs bg-green-100 text-green-700 font-semibold px-3 py-1 rounded-full">Secured via Vercel API Key</span>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Add Lead Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm md:col-span-1 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Add New Lead</h2>
                <form id="leadForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Name</label>
                        <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
                        <input type="email" id="email" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Phone</label>
                        <input type="text" id="phone" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Value (₹)</label>
                        <input type="number" id="value" value="0" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">Save Lead</button>
                </form>
            </div>

            <!-- Leads List Table -->
            <div class="bg-white p-6 rounded-xl shadow-sm md:col-span-2 overflow-x-auto">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Leads Database</h2>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b text-sm text-gray-500">
                            <th class="py-2 px-3">Name</th>
                            <th class="py-2 px-3">Email</th>
                            <th class="py-2 px-3">Phone</th>
                            <th class="py-2 px-3">Value</th>
                            <th class="py-2 px-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody" class="text-sm text-gray-700">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-gray-400">Loading leads...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- JavaScript interacting with Vercel Serverless API using x-api-key -->
    <script>
        async function fetchLeads() {
            try {
                const response = await fetch('/api/leads');
                const leads = await response.json();
                
                const tbody = document.getElementById('leadsTableBody');
                if (!leads || leads.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-400">No leads found. Add your first lead!</td></tr>`;
                    return;
                }

                tbody.innerHTML = leads.map(lead => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="py-3 px-3 font-medium text-gray-800">${lead.name || ''}</td>
                        <td class="py-3 px-3 text-gray-500">${lead.email || '-'}</td>
                        <td class="py-3 px-3 text-gray-500">${lead.phone || '-'}</td>
                        <td class="py-3 px-3">₹${lead.value || 0}</td>
                        <td class="py-3 px-3"><span class="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded-full">${lead.status || 'New'}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error fetching leads:', err);
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const newLead = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                value: parseFloat(document.getElementById('value').value) || 0,
                status: 'New'
            };

            try {
                const response = await fetch('/api/leads', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-api-key': 'my_super_secret_crm_key_9876' // Matches the Vercel ENV variable
                    },
                    body: JSON.stringify(newLead)
                });

                if (response.ok) {
                    document.getElementById('leadForm').reset();
                    fetchLeads(); // Refresh table
                } else {
                    alert('Unauthorized or failed to save lead');
                }
            } catch (err) {
                console.error('Error saving lead:', err);
            }
        }

        // Load leads on initial page load
        fetchLeads();
    </script>
</body>
</html>
